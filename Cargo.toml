[workspace]
members = ["programs/*"]
resolver = "2"

# The Solana version `solana-verify` builds with (Agave 4.3.0).
[workspace.metadata.cli]
solana = "4.3.0"

[workspace.package]
edition = "2021"
# MSRV of the on-chain crates: at or below the compiler of the SBF platform-tools of Agave 4.3.0.
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.release.package.pack_binder]
opt-level = "z"
